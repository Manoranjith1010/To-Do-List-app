<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>To-Do List</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 40px; max-width: 720px; }
      h1 { color: #333; }
      form { margin-bottom: 20px; }
      input[type="text"] { width: 75%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
      button { padding: 10px 16px; border: none; background: #28a745; color: white; border-radius: 4px; cursor: pointer; }
      button:hover { background: #218838; }
      ul { list-style: none; padding: 0; }
      li { background: #f8f9fa; margin-bottom: 10px; padding: 12px 14px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
      .task-text { margin-right: 12px; }
      .delete-button { background: #dc3545; }
      .delete-button:hover { background: #c82333; }
    </style>
  </head>
  <body>
    <h1>To-Do List</h1>
    <form action="/add" method="post">
      <input type="text" name="task" placeholder="Add a new task" autocomplete="off" required>
      <button type="submit">Add</button>
    </form>

    {% if tasks %}
      <ul>
        {% for task in tasks %}
          <li>
            <span class="task-text">{{ loop.index }}. {{ task }}</span>
            <a href="/delete/{{ loop.index0 }}"><button type="button" class="delete-button">Delete</button></a>
          </li>
        {% endfor %}
      </ul>
    {% else %}
      <p>No tasks yet. Add one above.</p>
    {% endif %}
  </body>
</html>
